<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-labelledby="t d">
<title id="t">三份记录，回答三个不同问题</title><desc id="d">教学示意。先保存购买订单，再核对卡密兑换状态，最后回本人账号查看当前方案。任何一步不一致，都回原商家的原订单处理，不连续重复付款。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#225e93" stroke-width="2"/></marker></defs>
<rect width="960" height="1200" fill="#ffffff"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172a35">
<text x="44" y="52" font-size="29" font-weight="600" fill="#225e93">公开指南 · GETGPT 购买前核对</text>
<text x="44" y="115" font-size="43" font-weight="700">三份记录，回答三个不同问题</text>
<text x="44" y="157" font-size="30" fill="#445969">流程示意，非商家实际界面或交付承诺</text>
<rect x="44" y="182" width="872" height="204" rx="22" fill="#eff6fc" stroke="#225e93" stroke-width="2"/>
<circle cx="91" cy="229" r="25" fill="#225e93"/><text x="91" y="240" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">1</text>
<text x="134" y="243" font-size="48" font-weight="700">购买：钱付给了谁？</text>
<text x="74" y="302" font-size="44">核对商品、周期、收款方。</text><text x="74" y="351" font-size="42" fill="#445969">发卡密 ≠ 账号已升级</text>
<path d="M480 390V428" fill="none" stroke="#225e93" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="44" y="442" width="872" height="204" rx="22" fill="#eff6fc" stroke="#225e93" stroke-width="2"/>
<circle cx="91" cy="489" r="25" fill="#225e93"/><text x="91" y="500" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">2</text>
<text x="134" y="503" font-size="48" font-weight="700">兑换：处理到哪一步？</text>
<text x="74" y="562" font-size="44">核对本单入口、条件与状态。</text><text x="74" y="611" font-size="42" fill="#445969">已提交 ≠ 升级完成</text>
<path d="M480 650V688" fill="none" stroke="#225e93" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="44" y="702" width="872" height="204" rx="22" fill="#eff6fc" stroke="#225e93" stroke-width="2"/>
<circle cx="91" cy="749" r="25" fill="#225e93"/><text x="91" y="760" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">3</text>
<text x="134" y="763" font-size="48" font-weight="700">账号：权益对得上吗？</text>
<text x="74" y="822" font-size="44">本人查看当前方案与期限。</text><text x="74" y="871" font-size="42" fill="#445969">再对照原订单逐项验收。</text>
<rect x="44" y="956" width="872" height="196" rx="22" fill="#fff6e7" stroke="#a86a10" stroke-width="2"/>
<text x="72" y="1007" font-size="44" font-weight="700" fill="#714208">扣款后有疑问？</text>
<text x="72" y="1059" font-size="42" fill="#714208">回原商家、原订单核对处理。</text>
<text x="72" y="1110" font-size="42" fill="#714208">先核对，不连续重复付款。</text>
</g></svg>