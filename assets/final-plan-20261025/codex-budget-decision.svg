<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17313c}.title{font-size:42px;font-weight:700}.body{font-size:27px}.label{font-size:30px;font-weight:650}.small{font-size:23px;fill:#526c77}</style></defs><rect width="1440" height="920" rx="28" fill="#f5f8fa"/><text x="60" y="65" class="small">Codex预算：先找限制属于哪个账本</text><text x="60" y="130" class="title">用量不够，先算这一月实际要花多少</text><text x="60" y="184" class="body">功能或权限问题先处理；不是所有报错都能靠换更贵套餐解决。</text><rect x="60" y="235" width="420" height="150" rx="18" fill="#dfedf0"/><text x="84" y="286" class="label">ChatGPT订阅</text><text x="84" y="337" class="small">当前方案、账期与可用功能</text><rect x="510" y="235" width="420" height="150" rx="18" fill="#e9e3f6"/><text x="534" y="286" class="label">适用额外credits</text><text x="534" y="337" class="small">本人用量面板、可选价格与重置</text><rect x="960" y="235" width="420" height="150" rx="18" fill="#f7ead8"/><text x="984" y="286" class="label">API项目账单</text><text x="984" y="337" class="small">Key所属项目、预算与按量费用</text><rect x="60" y="425" width="1320" height="133" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="86" y="475" class="label">每项换成同一记账币种，只合计一次</text><text x="86" y="522" class="body">本月订阅 + 额外用量 + API费用 + 未含税费/手续费 ≤ 自定上限</text><rect x="60" y="600" width="420" height="195" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="84" y="644" class="label">先等待或缩小任务</text><text x="84" y="691" class="small">当前功能可用、用量将重置</text><text x="84" y="735" class="small">限制输入、拆小任务，记录返工</text><rect x="510" y="600" width="420" height="195" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="534" y="644" class="label">再比较补充用量</text><text x="534" y="691" class="small">本人界面确有适用入口</text><text x="534" y="735" class="small">写清可用范围、规则与新增成本</text><rect x="960" y="600" width="420" height="195" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="984" y="644" class="label">最后比较套餐调整</text><text x="984" y="691" class="small">持续遇到相同的真实限制</text><text x="984" y="735" class="small">核权益、下次扣费与完整月度成本</text><text x="60" y="838" class="small">没有固定任务数或回本保证；具体价格、资格与用量以官方页面和本人账户为准。</text><text x="60" y="882" class="small">运营方原创解释图 · 非官方界面、真实订单或成功率证明</text></svg>