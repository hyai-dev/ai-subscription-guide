<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17313c}.title{font-size:42px;font-weight:700}.body{font-size:27px}.label{font-size:30px;font-weight:650}.small{font-size:23px;fill:#526c77}</style></defs><rect width="1440" height="920" rx="28" fill="#f5f8fa"/><text x="60" y="65" class="small">买前判断：商家能交付什么，平台是否允许使用，是两件事</text><text x="60" y="130" class="title">“靠谱”先变成六个能回答的问题</text><text x="60" y="184" class="body">域名、价格或成功截图，不能代替账号资格和本单条件。</text><rect x="60" y="235" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="86" y="277" class="label">1. 身份与收款</text><text x="86" y="319" class="body">谁在运营？谁收钱？</text><text x="86" y="356" class="small">域名、服务方与付款方对得上</text><rect x="740" y="235" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="766" y="277" class="label">2. 商品与费用</text><text x="766" y="319" class="body">买到哪里？共要多少钱？</text><text x="766" y="356" class="small">周期、币种、税费和续费分别记</text><rect x="60" y="410" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="86" y="452" class="label">3. 官方资格</text><text x="86" y="494" class="body">地区、账号和使用方式适用吗？</text><text x="86" y="531" class="small">第三方收款不改变平台规则</text><rect x="740" y="410" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="766" y="452" class="label">4. 资料与授权</text><text x="766" y="494" class="body">为什么要这项资料？交给谁？</text><text x="766" y="531" class="small">普通核单与必要兑换授权分开</text><rect x="60" y="585" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="86" y="627" class="label">5. 结果验收</text><text x="86" y="669" class="body">付款、发卡、兑换还是权益？</text><text x="86" y="706" class="small">本人方案和周期需要单独核对</text><rect x="740" y="585" width="640" height="150" rx="18" fill="white" stroke="#cbdce3" stroke-width="2"/><text x="766" y="627" class="label">6. 异常与退出</text><text x="766" y="669" class="body">错发、失败或退款怎么处理？</text><text x="766" y="706" class="small">退款不自动撤销已有账号访问</text><rect x="60" y="786" width="1320" height="60" rx="14" fill="#eae4f5"/><text x="86" y="826" class="body">关键条件答不清：先补证据。已经付款：回原单，不另买一单来验证。</text><text x="60" y="882" class="small">运营方原创解释图 · 非官方界面、真实订单或成功率证明</text></svg>