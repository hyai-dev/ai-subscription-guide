<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110"><rect width="640" height="1110" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">付款后，分别查五项</text><text x="34" y="111" font-size="30">前一项完成不能证明后一项</text><rect x="28" y="145" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="148" rx="4" fill="#514587"/><text x="52" y="194" font-size="36" font-weight="700" fill="#514587">01 付款记录</text><text x="52" y="245" font-size="34">原渠道是否确认该笔付款</text><rect x="28" y="311" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="311" width="8" height="148" rx="4" fill="#514587"/><text x="52" y="360" font-size="36" font-weight="700" fill="#514587">02 实际交付</text><text x="52" y="411" font-size="34">收到的是本商品承诺的什么</text><rect x="28" y="477" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="477" width="8" height="148" rx="4" fill="#514587"/><text x="52" y="526" font-size="36" font-weight="700" fill="#514587">03 兑换反馈</text><text x="52" y="577" font-size="34">如有兑换，查看实际结果</text><rect x="28" y="643" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="643" width="8" height="148" rx="4" fill="#514587"/><text x="52" y="692" font-size="36" font-weight="700" fill="#514587">04 目标账号</text><text x="52" y="743" font-size="34">账号与工作区是否正确</text><rect x="28" y="809" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="809" width="8" height="148" rx="4" fill="#514587"/><text x="52" y="858" font-size="36" font-weight="700" fill="#514587">05 套餐周期</text><text x="52" y="909" font-size="34">与购买约定逐项对照</text><rect x="28" y="1005" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="1054" font-size="30" font-weight="700">不适用的环节按原流程跳过</text></g></svg>