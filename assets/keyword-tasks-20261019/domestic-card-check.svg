<svg xmlns="http://www.w3.org/2000/svg" width="640" height="944" viewBox="0 0 640 944"><rect width="640" height="944" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">国内信用卡怎么核对</text><text x="34" y="111" font-size="30">资格、资料、认证与结果分别看</text><rect x="28" y="145" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="148" rx="4" fill="#315b80"/><text x="52" y="194" font-size="36" font-weight="700" fill="#315b80">01 地区与资格</text><text x="52" y="245" font-size="34">本人和发卡行规则分别查</text><rect x="28" y="311" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="311" width="8" height="148" rx="4" fill="#315b80"/><text x="52" y="360" font-size="36" font-weight="700" fill="#315b80">02 真实账单资料</text><text x="52" y="411" font-size="34">姓名、地址与银行记录相符</text><rect x="28" y="477" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="477" width="8" height="148" rx="4" fill="#315b80"/><text x="52" y="526" font-size="36" font-weight="700" fill="#315b80">03 银行交易要求</text><text x="52" y="577" font-size="34">权限、余额与认证按要求处理</text><rect x="28" y="643" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="643" width="8" height="148" rx="4" fill="#315b80"/><text x="52" y="692" font-size="36" font-weight="700" fill="#315b80">04 原付款状态</text><text x="52" y="743" font-size="34">已有记录就回原渠道确认</text><rect x="28" y="839" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="888" font-size="30" font-weight="700">卡组织标志不等于资格证明</text></g></svg>