<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1132" viewBox="0 0 640 1132"><rect width="640" height="1132" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">选平台，看六项证据</text><text x="34" y="111" font-size="30">先把商品条件放在同一张表</text><rect x="28" y="145" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="194" font-size="36" font-weight="700" fill="#315b80">01 交付对象</text><text x="52" y="245" font-size="34">原号、材料或账号要写清</text><rect x="28" y="287" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="287" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="336" font-size="36" font-weight="700" fill="#315b80">02 适用条件</text><text x="52" y="387" font-size="34">资格、旧订阅和限制分别问</text><rect x="28" y="429" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="429" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="478" font-size="36" font-weight="700" fill="#315b80">03 完整报价</text><text x="52" y="529" font-size="34">币种、周期、税费放在一起</text><rect x="28" y="571" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="571" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="620" font-size="36" font-weight="700" fill="#315b80">04 资料权限</text><text x="52" y="671" font-size="34">谁接收、用什么、怎么撤销</text><rect x="28" y="713" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="713" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="762" font-size="36" font-weight="700" fill="#315b80">05 验收结果</text><text x="52" y="813" font-size="34">账号、套餐、周期能核查</text><rect x="28" y="855" width="584" height="124" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="855" width="8" height="124" rx="4" fill="#315b80"/><text x="52" y="904" font-size="36" font-weight="700" fill="#315b80">06 异常处理</text><text x="52" y="955" font-size="34">原订单、处理方与售后规则</text><rect x="28" y="1027" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="1076" font-size="30" font-weight="700">未知项先问清，不替商家编答案</text></g></svg>