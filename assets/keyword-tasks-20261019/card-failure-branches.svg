<svg xmlns="http://www.w3.org/2000/svg" width="640" height="944" viewBox="0 0 640 944"><rect width="640" height="944" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">绑卡失败，按位置分流</text><text x="34" y="111" font-size="30">先记录原文和是否有扣款</text><rect x="28" y="145" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="194" font-size="36" font-weight="700" fill="#8c4d1c">资料提交即被拒</text><text x="52" y="245" font-size="34">查真实资料、资格与银行权限</text><rect x="28" y="311" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="311" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="360" font-size="36" font-weight="700" fill="#8c4d1c">银行认证卡住</text><text x="52" y="411" font-size="34">按银行要求完成验证</text><rect x="28" y="477" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="477" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="526" font-size="36" font-weight="700" fill="#8c4d1c">已经出现扣款</text><text x="52" y="577" font-size="34">先查原记录，不重复付款</text><rect x="28" y="643" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="643" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="692" font-size="36" font-weight="700" fill="#8c4d1c">账号权益未变化</text><text x="52" y="743" font-size="34">核对交付、账号与套餐周期</text><rect x="28" y="839" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="888" font-size="30" font-weight="700">每个分支找对应处理方</text></g></svg>