<svg xmlns="http://www.w3.org/2000/svg" width="640" height="944" viewBox="0 0 640 944"><rect width="640" height="944" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">工单跟进四步</text><text x="34" y="111" font-size="30">用同一原订单保留处理线索</text><rect x="28" y="145" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="148" rx="4" fill="#21664f"/><text x="52" y="194" font-size="36" font-weight="700" fill="#21664f">01 回原购买入口</text><text x="52" y="245" font-size="34">记录订单状态和发生时间</text><rect x="28" y="311" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="311" width="8" height="148" rx="4" fill="#21664f"/><text x="52" y="360" font-size="36" font-weight="700" fill="#21664f">02 整理问题摘要</text><text x="52" y="411" font-size="34">只提供必要的脱敏证据</text><rect x="28" y="477" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="477" width="8" height="148" rx="4" fill="#21664f"/><text x="52" y="526" font-size="36" font-weight="700" fill="#21664f">03 记回复与下一步</text><text x="52" y="577" font-size="34">处理方、回看时间逐条记</text><rect x="28" y="643" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="643" width="8" height="148" rx="4" fill="#21664f"/><text x="52" y="692" font-size="36" font-weight="700" fill="#21664f">04 按问题验收</text><text x="52" y="743" font-size="34">回复了，不等于问题解决</text><rect x="28" y="839" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="888" font-size="30" font-weight="700">查单密码不公开，不当聊天附件</text></g></svg>