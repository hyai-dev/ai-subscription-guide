<svg xmlns="http://www.w3.org/2000/svg" width="640" height="944" viewBox="0 0 640 944"><rect width="640" height="944" fill="#f5f8fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#142c3b"><text x="34" y="62" font-size="38" font-weight="700">安全承诺怎么检查</text><text x="34" y="111" font-size="30">营销名称不能替代权限说明</text><rect x="28" y="145" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="145" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="194" font-size="36" font-weight="700" fill="#8c4d1c">01 账号归属</text><text x="52" y="245" font-size="34">谁控制、谁恢复、谁在使用</text><rect x="28" y="311" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="311" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="360" font-size="36" font-weight="700" fill="#8c4d1c">02 资料权限</text><text x="52" y="411" font-size="34">订单材料与登录凭证分开</text><rect x="28" y="477" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="477" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="526" font-size="36" font-weight="700" fill="#8c4d1c">03 交付验收</text><text x="52" y="577" font-size="34">具体账号、套餐与周期</text><rect x="28" y="643" width="584" height="148" rx="18" fill="white" stroke="#b3c4d4" stroke-width="2"/><rect x="28" y="643" width="8" height="148" rx="4" fill="#8c4d1c"/><text x="52" y="692" font-size="36" font-weight="700" fill="#8c4d1c">04 售后边界</text><text x="52" y="743" font-size="34">适用条件和实际处理分别看</text><rect x="28" y="839" width="584" height="78" rx="16" fill="#e2edf6"/><text x="44" y="888" font-size="30" font-weight="700">免密码不等于没有凭证风险</text></g></svg>