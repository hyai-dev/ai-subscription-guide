<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120"><rect width="640" height="1120" fill="#f6f9fc"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#12283a"><text x="40" y="70" font-size="38" font-weight="700">网络标签只是观察</text><text x="40" y="118" font-size="30">按四步核对，不推断支付结果</text><rect x="32" y="160" width="576" height="148" rx="20" fill="white" stroke="#aabccc" stroke-width="2"/><text x="56" y="213" font-size="35" font-weight="700">1 记录出口</text><text x="56" y="267" font-size="32">时间 · IP · 地区 · ASN</text><path d="M320 320v24m-10-10 10 10 10-10" stroke="#315b80" stroke-width="4" fill="none"/><rect x="32" y="360" width="576" height="148" rx="20" fill="white" stroke="#aabccc" stroke-width="2"/><text x="56" y="413" font-size="35" font-weight="700">2 理解数据源</text><text x="56" y="467" font-size="32">标签未返回，就记为未知</text><path d="M320 520v24m-10-10 10 10 10-10" stroke="#315b80" stroke-width="4" fill="none"/><rect x="32" y="560" width="576" height="148" rx="20" fill="white" stroke="#aabccc" stroke-width="2"/><text x="56" y="613" font-size="35" font-weight="700">3 核对服务规则</text><text x="56" y="667" font-size="32">实际资格与账号权限另查</text><path d="M320 720v24m-10-10 10 10 10-10" stroke="#315b80" stroke-width="4" fill="none"/><rect x="32" y="760" width="576" height="148" rx="20" fill="white" stroke="#aabccc" stroke-width="2"/><text x="56" y="813" font-size="35" font-weight="700">4 按具体错误处理</text><text x="56" y="867" font-size="32">保留脱敏信息，查官方帮助</text><rect x="32" y="978" width="576" height="94" rx="18" fill="#dbe9f5"/><text x="56" y="1038" font-size="32" font-weight="700">标签 ≠ 账号或付款资格</text></g></svg>